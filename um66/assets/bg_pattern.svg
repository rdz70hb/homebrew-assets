<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <pattern id="g" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0H0V90" fill="none" stroke="#2ce6ff" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M45 0V90M0 45H90" fill="none" stroke="#a78bfa" stroke-opacity="0.055" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#0b1020" fill-opacity="0.06"/>
      <circle cx="90" cy="0" r="1.2" fill="#0b1020" fill-opacity="0.06"/>
      <circle cx="0" cy="90" r="1.2" fill="#0b1020" fill-opacity="0.06"/>
      <circle cx="90" cy="90" r="1.2" fill="#0b1020" fill-opacity="0.06"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#g)"/>

  <!-- stars -->
  <g filter="url(#soft)" fill="#0b1020" fill-opacity="0.07">
    <circle cx="110" cy="140" r="1.3"/><circle cx="210" cy="220" r="0.9"/><circle cx="330" cy="170" r="1.0"/>
    <circle cx="520" cy="140" r="1.1"/><circle cx="640" cy="260" r="1.4"/><circle cx="760" cy="190" r="0.9"/>
    <circle cx="120" cy="520" r="1.0"/><circle cx="240" cy="610" r="1.2"/><circle cx="390" cy="520" r="0.9"/>
    <circle cx="520" cy="620" r="1.3"/><circle cx="690" cy="560" r="1.0"/><circle cx="810" cy="650" r="1.2"/>
    <circle cx="160" cy="820" r="1.4"/><circle cx="350" cy="780" r="0.9"/><circle cx="560" cy="820" r="1.1"/>
    <circle cx="740" cy="820" r="1.3"/>
  </g>

  <!-- constellation lines -->
  <g stroke="#a78bfa" stroke-opacity="0.06" stroke-width="2" fill="none">
    <path d="M110 140 L210 220 L330 170 L520 140" />
    <path d="M240 610 L390 520 L520 620 L690 560" />
    <path d="M160 820 L350 780 L560 820 L740 820" />
  </g>
</svg>