<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ce6ff" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#fade)"/>

  <!-- techno rings -->
  <g fill="none" stroke="#2ce6ff" stroke-opacity="0.10" stroke-width="2">
    <circle cx="600" cy="600" r="330"/>
    <circle cx="600" cy="600" r="255" stroke-opacity="0.08"/>
    <circle cx="600" cy="600" r="185" stroke-opacity="0.06"/>
  </g>

  <!-- arcane circle -->
  <g fill="none" stroke="#a78bfa" stroke-opacity="0.10" stroke-width="2">
    <circle cx="600" cy="600" r="295"/>
    <path d="M600 305 A295 295 0 0 1 895 600" />
    <path d="M305 600 A295 295 0 0 0 600 895" />
  </g>

  <!-- ticks -->
  <g stroke="#0b1020" stroke-opacity="0.10" stroke-width="2">
    <g transform="translate(600 600)">
      <!-- 24 ticks -->
      <g transform="rotate(0)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(15)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(45)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(75)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(105)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(135)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(165)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(195)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(225)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(255)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(285)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(315)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
      <g transform="rotate(345)"><line x1="0" y1="-330" x2="0" y2="-312"/></g>
    </g>
  </g>

  <!-- sigil nodes -->
  <g fill="#ffd166" fill-opacity="0.10">
    <circle cx="600" cy="270" r="10"/>
    <circle cx="930" cy="600" r="10"/>
    <circle cx="600" cy="930" r="10"/>
    <circle cx="270" cy="600" r="10"/>
  </g>

  <!-- subtle chord -->
  <g stroke="#0b1020" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M600 270 C720 420 850 520 930 600 C850 680 720 780 600 930 C480 780 350 680 270 600 C350 520 480 420 600 270 Z"/>
  </g>
